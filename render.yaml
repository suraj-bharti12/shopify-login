# Render Blueprint. Render asks for MONGODB_URI and OTP_SECRET.
services:
  - type: web
    name: shopify-login
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEV_TEST_CLIENT
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: COOKIE_KEYS
        generateValue: true